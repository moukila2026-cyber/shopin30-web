<svg xmlns="http://www.w3.org/2000/svg" width="306" height="74" viewBox="0 0 306 74" role="img" aria-labelledby="title desc">
  <title id="title">ShopIn30</title>
  <desc id="desc">Logo ShopIn30 blanc sur fond noir, avec un trait vert vif.</desc>
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="2" seed="8" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="fade"><feFuncA type="table" tableValues="0 .075"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="fade" mode="screen"/>
    </filter>
    <linearGradient id="surface" x2="1" y2="1"><stop stop-color="#171a16"/><stop offset="1" stop-color="#080908"/></linearGradient>
  </defs>
  <rect x="1" y="3" width="304" height="68" rx="12" fill="url(#surface)" stroke="#343a31" stroke-width="1.5" filter="url(#grain)"/>
  <g transform="rotate(-4 151 38)">
    <text x="20" y="52" fill="#fff" font-family="Arial Black, Impact, sans-serif" font-size="42" font-style="italic" font-weight="900" letter-spacing="-2.8">ShopIn30</text>
  </g>
  <path d="M22 61 110 56" stroke="#d4f926" stroke-width="4" stroke-linecap="round"/>
  <path d="M117 56 136 55" stroke="#d4f926" stroke-width="2" stroke-linecap="round" opacity=".65"/>
</svg>
